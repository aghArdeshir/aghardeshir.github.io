  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    :root {
      --bg-oled: #050507;
      --card-bg: #0A0A0E;
      --panel-bg: #0D0D14;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --text-white: #FFFFFF;
      --text-gray: #A1A1AA;
      --text-dim: #52525B;
      --accent-cyan: #00F3FF;
      --accent-green: #10B981;
      --accent-purple: #A855F7;
      --accent-gold: #F59E0B;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      font-family: var(--font-sans);
      color: var(--text-white);
      overflow: hidden;
    }

    /* Main Desktop Viewport Container Mockup */
    .app-viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #12121A 0%, #000000 100%);
    }

    .mobile-frame {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      background-color: var(--bg-oled);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 480px) {
      .mobile-frame {
        height: 92vh;
        max-height: 900px;
        border-radius: 40px;
        border: 1px solid var(--border-subtle);
        box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 40px rgba(0, 243, 255, 0.05);
      }
    }

    /* HUD Header */
    .hud-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 54px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: rgba(5, 5, 7, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .counter-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-white);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .counter-pill:hover, .counter-pill:active {
      background: rgba(0, 243, 255, 0.15);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .sound-toggle-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--text-white);
      transition: all 0.2s ease;
    }

    .sound-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .progress-bar-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.05);
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
      box-shadow: 0 0 8px var(--accent-cyan);
      transition: width 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    /* Snap Scroll Container */
    .cards-scroll-container {
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none; /* Firefox */
    }

    .cards-scroll-container::-webkit-scrollbar {
      display: none; /* Chrome/Safari */
    }

    /* Individual Micro-Card */
    .micro-card {
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      padding: 74px 24px 32px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      background-color: var(--bg-oled);
      overflow: hidden;
    }

    .card-module-tag {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent-cyan);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-headline {
      font-size: 2.1rem;
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: -0.025em;
      color: var(--text-white);
      margin-bottom: 16px;
    }

    .card-body {
      font-size: 1.05rem;
      line-height: 1.52;
      color: var(--text-gray);
      font-weight: 400;
      margin-bottom: 18px;
    }

    .card-code-pill {
      font-family: var(--font-mono);
      background-color: var(--panel-bg);
      border-left: 3px solid var(--accent-green);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 0.88rem;
      line-height: 1.45;
      color: #E4E4E7;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
      margin-top: 4px;
      user-select: text;
    }

    .card-footer-number {
      position: absolute;
      bottom: 18px;
      right: 24px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 0.05em;
    }

    /* Checkpoint Card Styling */
    .micro-card.checkpoint-card {
      background: radial-gradient(circle at center, #11111F 0%, var(--bg-oled) 80%);
      align-items: center;
      text-align: center;
    }

    .checkpoint-badge {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.2), rgba(16, 185, 129, 0.2));
      border: 1px solid var(--accent-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      margin-bottom: 20px;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
      animation: pulseGlow 2s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); transform: scale(1); }
      100% { box-shadow: 0 0 35px rgba(0, 243, 255, 0.5); transform: scale(1.05); }
    }

    .checkpoint-card .card-headline {
      font-size: 2.3rem;
      background: linear-gradient(135deg, #FFFFFF 30%, var(--accent-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .checkpoint-sub {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent-green);
      margin-bottom: 16px;
    }

    .checkpoint-recap-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 18px 20px;
      max-width: 360px;
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text-gray);
      margin-top: 10px;
    }

    /* Jump Modal Overlay */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 200;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 20px 20px 24px 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-top: 8px;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text-white);
    }

      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: var(--text-white);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

      flex: 1;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text-white);
      font-size: 0.95rem;
      outline: none;
      font-family: var(--font-sans);
    }

    .jump-input:focus {
      border-color: var(--accent-cyan);
    }

    .jump-go-btn {
      background: var(--accent-cyan);
      color: #000000;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .chapter-quick-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      flex: 1;
      padding-right: 4px;
    }

    .chapter-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chapter-item:hover {
      background: rgba(0, 243, 255, 0.1);
      border-color: var(--accent-cyan);
    }

      font-weight: 600;
      color: var(--text-white);
    }

    .chapter-item-range {
      font-size: 0.75rem;
      color: var(--accent-cyan);
      font-weight: 700;
    }

    /* Canvas Confetti Overlay */
    #confetti-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 150;
    }
  </style>
</head>

      const filtered = cardsData.filter(c => 
        c.headline.toLowerCase().includes(query) || 
        (c.body && c.body.toLowerCase().includes(query)) ||
        (c.code && c.code.toLowerCase().includes(query))
      );
      
      if (filtered.length === 0) {
        chapterQuickList.innerHTML = '<div style="color:var(--text-dim); text-align:center; padding:20px;">No matching cards found</div>';
        return;

      filtered.forEach(c => {
        const item = document.createElement('div');
        item.className = 'chapter-item';
        item.innerHTML = `
          <div class="chapter-item-title">${c.number}. ${c.headline}</div>
          <div class="chapter-item-range">M${c.moduleId}</div>

        item.addEventListener('click', () => {
          jumpToCard(c.number);
          closeModal();
        });
        chapterQuickList.appendChild(item);
      });
      return;

    // Default Module Chapter List

    cardsData.forEach(c => {

        modulesMap[c.moduleId] = {
          id: c.moduleId,

          start: c.number,

        gain.gain.setValueAtTime(0.001, now + i * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.15, now + i * 0.08 + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.4);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start(now + i * 0.08);
        osc.stop(now + i * 0.08 + 0.45);
      });
    } catch(e) {
      console.log('Audio error:', e);
    }
  }

  // Confetti Particle Engine
  let particles = [];
  function launchConfetti() {
    particles = [];
    const colors = ['#00F3FF', '#10B981', '#A855F7', '#F59E0B', '#FFFFFF'];
    const count = 70;
    
    for (let i = 0; i < count; i++) {
      particles.push({
        x: confettiCanvas.width / 2 + (Math.random() - 0.5) * 100,
        y: confettiCanvas.height / 2 + 50,
        vx: (Math.random() - 0.5) * 12,
        vy: -Math.random() * 14 - 6,
        size: Math.random() * 6 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * 360,
        rSpeed: (Math.random() - 0.5) * 10,
        opacity: 1.0
      });
    }
    requestAnimationFrame(updateConfetti);
  }

  function updateConfetti() {
    ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    let active = false;
    
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.4; // gravity
      p.opacity -= 0.012;
      p.rotation += p.rSpeed;
      
      if (p.opacity > 0) {
        active = true;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.opacity);
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      }
    });
    
    if (active) {
      requestAnimationFrame(updateConfetti);
    }
  }

  // IntersectionObserver to detect active card
  let lastTriggeredCheckpoint = -1;
  
  function setupObserver() {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const idx = parseInt(entry.target.dataset.index, 10);
          currentIndex = idx;
          updateHUD(idx);
          saveProgress(idx);

          // Trigger quiet celebration on checkpoint cards
          if (cardsData[idx].isCheckpoint && lastTriggeredCheckpoint !== idx) {
            lastTriggeredCheckpoint = idx;
            playCheckpointChime();
            launchConfetti();
          }
        }
      });
    }, {
      root: scrollContainer,
      threshold: 0.6
    });

    document.querySelectorAll('.micro-card').forEach(card => observer.observe(card));
  }

  function updateHUD(idx) {
    const currentNum = idx + 1;
    const total = cardsData.length;
    hudCounterText.textContent = `Card ${currentNum} / ${total}`;
    const pct = (currentNum / total) * 100;
    hudProgressFill.style.width = `${pct}%`;
  }

  function saveProgress(idx) {
    try {
      localStorage.setItem(STORAGE_KEY, idx);
    } catch(e) {}
  }

  function loadProgress() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved !== null) {
        const idx = parseInt(saved, 10);
        if (!isNaN(idx) && idx >= 0 && idx < cardsData.length) {
          jumpToCard(idx + 1, false);
        }
      }
    } catch(e) {}
  }

  function jumpToCard(num, smooth = true) {
    const targetNum = Math.max(1, Math.min(cardsData.length, num));
    const targetEl = document.getElementById(`card-${targetNum}`);
    if (targetEl) {
      targetEl.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto' });
    }
  }

  // Jump Modal Handlers
  function openModal() {
    renderModalChapters();
    jumpModal.classList.add('active');
    modalNumInput.value = currentIndex + 1;
    modalSearchInput.value = '';
    modalNumInput.focus();
  }

  function closeModal() {
    jumpModal.classList.remove('active');
  }

  hudCounterBtn.addEventListener('click', openModal);
  modalCloseBtn.addEventListener('click', closeModal);
  
  jumpModal.addEventListener('click', (e) => {
    if (e.target === jumpModal) closeModal();
  });

  modalJumpBtn.addEventListener('click', () => {
    const val = parseInt(modalNumInput.value, 10);
    if (!isNaN(val)) {
      jumpToCard(val);
      closeModal();
    }
  });

  modalNumInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      modalJumpBtn.click();
    }
  });

  modalSearchInput.addEventListener('input', (e) => {
    renderModalChapters(e.target.value);
  });

  // Sound Toggle
  hudSoundBtn.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    hudSoundBtn.textContent = soundEnabled ? '🔊' : '🔇';
  });

  // Keyboard Shortcuts
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return; // Don't interrupt typing in inputs
    
    if (e.key === 'j' || e.key === 'J') {
      e.preventDefault();
      if (jumpModal.classList.contains('active')) {
        closeModal();
      } else {
        openModal();
      }
    } else if (e.key === 'Escape') {
      closeModal();
    } else if (e.key === 'm' || e.key === 'M') {
      hudSoundBtn.click();
    } else if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') {
      e.preventDefault();
      jumpToCard(currentIndex + 2);
    } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
      e.preventDefault();
      jumpToCard(currentIndex);
    }
  });

  // Init App
  renderCards();
  setupObserver();
  loadProgress();

</script>
</body>
</html>
